<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Forge - pixel art studio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#14090f; color:#ffeef3; min-height:100vh; }
  .wrap { max-width:780px; margin:0 auto; padding:20px 14px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  h1 { font-size:22px; font-weight:800; }
  h1 .p { color:#fb7185; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:#1f0e18; border:1px solid #3d1830; border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .bar button, .bar select { background:#2a1220; border:1px solid #4a1f3a; color:#ffeef3; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .bar button.on { background:#9f1239; border-color:#fb7185; }
  .bar button:hover { border-color:#fb7185; }
  .studio { display:flex; gap:14px; flex-wrap:wrap; }
  #board { background:#0d060b; border:1px solid #3d1830; border-radius:12px; padding:10px; touch-action:none; }
  #cv { display:block; image-rendering:pixelated; cursor:crosshair; }
  .side { flex:1; min-width:200px; display:flex; flex-direction:column; gap:12px; }
  .panel { background:#1f0e18; border:1px solid #3d1830; border-radius:12px; padding:12px; }
  .panel .k { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#b06a85; margin-bottom:8px; }
  .swatches { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
  .sw { aspect-ratio:1; border-radius:6px; border:2px solid transparent; cursor:pointer; }
  .sw.sel { border-color:#fff; }
  .customrow { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .customrow input[type=color] { width:40px; height:32px; border:none; background:none; cursor:pointer; }
  .customrow span { font-size:12px; color:#b06a85; }
  #mini { image-rendering:pixelated; border:1px solid #3d1830; border-radius:8px; background:#0d060b; align-self:flex-start; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions button, .actions a { background:#2a1220; border:1px solid #4a1f3a; color:#ffeef3; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; text-decoration:none; text-align:center; }
  .actions .go { background:linear-gradient(135deg,#f43f5e,#be123c); border:none; font-weight:700; }
  footer { text-align:center; color:#6b3a52; font-size:12px; margin-top:24px; }
  footer a { color:#b06a85; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1><span class="p">&#9608;</span> Pixel Forge</h1>
    <div class="bar" style="margin:0;padding:6px 10px">
      <select id="gsize"><option value="16">16 x 16</option><option value="24">24 x 24</option><option value="32" selected>32 x 32</option></select>
    </div>
  </header>
  <div class="bar">
    <button data-tool="pencil" class="on">Pencil</button>
    <button data-tool="eraser">Eraser</button>
    <button data-tool="fill">Fill</button>
    <button data-tool="picker">Pick</button>
    <button id="mirror">Mirror X</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
  </div>
  <div class="studio">
    <div id="board"><canvas id="cv"></canvas></div>
    <div class="side">
      <div class="panel"><div class="k">Palette</div><div class="swatches" id="swatches"></div>
        <div class="customrow"><input type="color" id="custom" value="#fb7185"><span>custom color</span></div>
      </div>
      <div class="panel"><div class="k">Preview</div><canvas id="mini"></canvas></div>
      <div class="actions">
        <a id="export" class="go" download="pixel-art.png">Export PNG</a>
      </div>
    </div>
  </div>
  <footer><a href="index.html">&#8592; About</a> &nbsp;|&nbsp; Pixel Forge &middot; idea #4 from the iLanis App Factory</footer>
</div>
<script>
var PALETTE=['#000000','#ffffff','#6b7280','#d1d5db','#7f1d1d','#ef4444','#fb7185','#f97316','#fbbf24','#fef08a','#4d7c0f','#22c55e','#86efac','#0f766e','#2dd4bf','#0ea5e9','#38bdf8','#1e3a8a','#6366f1','#a78bfa','#7e22ce','#d946ef','#f9a8d4','#92400e','#d6a05a','#78350f','#365314','#155e75','#881337','#fda4af','#fde68a','#bbf7d0','#a5f3fc'];
var S={size:32,grid:[],tool:'pencil',color:'#ef4444',mirror:false,undo:[],drawing:false};
var cv=document.getElementById('cv'), g=cv.getContext('2d'), mini=document.getElementById('mini'), mg=mini.getContext('2d');
var CELL=18;
function blank(n){ var a=[]; for(var y=0;y<n;y++){a.push(new Array(n).fill(null));} return a; }
function setup(n, keep){
  var old=S.grid; S.size=n; S.grid=blank(n);
  if(keep&&old.length){ for(var y=0;y<Math.min(n,old.length);y++)for(var x=0;x<Math.min(n,old.length);x++)S.grid[y][x]=old[y][x]; }
  var px=Math.min(560, Math.floor((window.innerWidth<700?window.innerWidth-60:560)/n)*n);
  CELL=Math.max(8,Math.floor(px/n));
  cv.width=n*CELL; cv.height=n*CELL; mini.width=n*4; mini.height=n*4;
  draw();
}
function draw(){
  g.clearRect(0,0,cv.width,cv.height);
  for(var y=0;y<S.size;y++)for(var x=0;x<S.size;x++){
    var c=S.grid[y][x];
    g.fillStyle=c||((x+y)%2?'#160a12':'#1b0d16');
    g.fillRect(x*CELL,y*CELL,CELL,CELL);
    if(!c){g.strokeStyle='rgba(255,255,255,0.04)';g.strokeRect(x*CELL+.5,y*CELL+.5,CELL-1,CELL-1);}
  }
  mg.clearRect(0,0,mini.width,mini.height);
  for(var y2=0;y2<S.size;y2++)for(var x2=0;x2<S.size;x2++){
    if(S.grid[y2][x2]){mg.fillStyle=S.grid[y2][x2];mg.fillRect(x2*4,y2*4,4,4);}
  }
  updateExport();
}
function snap(){ S.undo.push(JSON.stringify(S.grid)); if(S.undo.length>40)S.undo.shift(); }
function cellAt(e){
  var r=cv.getBoundingClientRect();
  var x=Math.floor((e.clientX-r.left)/r.width*S.size), y=Math.floor((e.clientY-r.top)/r.height*S.size);
  if(x<0||y<0||x>=S.size||y>=S.size)return null; return {x:x,y:y};
}
function paint(x,y){
  var v=S.tool==='eraser'?null:S.color;
  if(S.tool==='picker'){ if(S.grid[y][x]){S.color=S.grid[y][x]; syncPalette();} return; }
  if(S.tool==='fill'){ flood(x,y,S.grid[y][x],v); return; }
  if(S.grid[y][x]===v && !(S.mirror&&S.size-1-x!==x)) return;
  S.grid[y][x]=v;
  if(S.mirror) S.grid[y][S.size-1-x]=v;
  draw();
}
function flood(x,y,from,to){
  if(from===to)return;
  var st=[[x,y]],n=S.size;
  while(st.length){ var p=st.pop(),px=p[0],py=p[1];
    if(px<0||py<0||px>=n||py>=n||S.grid[py][px]!==from)continue;
    S.grid[py][px]=to;
    st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
  }
  if(S.mirror){ /* mirror applies to strokes, not flood */ }
  draw();
}
var last=null;
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId);
  var c=cellAt(e); if(!c)return;
  if(S.tool!=='picker') snap();
  S.drawing=true; paint(c.x,c.y); last=c; });
cv.addEventListener('pointermove',function(e){ if(!S.drawing)return;
  var c=cellAt(e); if(!c)return;
  if(S.tool==='pencil'||S.tool==='eraser'){ line(last,c); last=c; } });
cv.addEventListener('pointerup',function(){ S.drawing=false; last=null; });
function line(a,b){ if(!a){paint(b.x,b.y);return;}
  var dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y),sx=a.x<b.x?1:-1,sy=a.y<b.y?1:-1,err=dx-dy,x=a.x,y=a.y;
  while(true){ paint(x,y); if(x===b.x&&y===b.y)break;
    var e2=2*err; if(e2>-dy){err-=dy;x+=sx;} if(e2<dx){err+=dx;y+=sy;} }
}
document.querySelectorAll('[data-tool]').forEach(function(b){
  b.onclick=function(){ document.querySelectorAll('[data-tool]').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); S.tool=b.dataset.tool; };
});
document.getElementById('mirror').onclick=function(e){ S.mirror=!S.mirror; e.target.classList.toggle('on',S.mirror); };
document.getElementById('undo').onclick=function(){ var s=S.undo.pop(); if(s){S.grid=JSON.parse(s);draw();} };
document.getElementById('clear').onclick=function(){ snap(); S.grid=blank(S.size); draw(); };
document.getElementById('gsize').onchange=function(e){ setup(parseInt(e.target.value,10),false); };
document.getElementById('custom').oninput=function(e){ S.color=e.target.value; syncPalette(); };
function syncPalette(){ document.querySelectorAll('.sw').forEach(function(s){ s.classList.toggle('sel', s.dataset.c===S.color); }); }
var sw=document.getElementById('swatches');
PALETTE.forEach(function(c){ var d=document.createElement('div'); d.className='sw'; d.style.background=c; d.dataset.c=c;
  d.onclick=function(){ S.color=c; syncPalette(); if(S.tool==='eraser'||S.tool==='picker'){S.tool='pencil'; document.querySelectorAll('[data-tool]').forEach(function(x){x.classList.toggle('on',x.dataset.tool==='pencil');});} };
  sw.appendChild(d); });
function updateExport(){
  var n=S.size, scale=Math.max(1,Math.floor(512/n));
  var off=document.createElement('canvas'); off.width=n*scale; off.height=n*scale;
  var og=off.getContext('2d'); og.imageSmoothingEnabled=false;
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){ if(S.grid[y][x]){og.fillStyle=S.grid[y][x];og.fillRect(x*scale,y*scale,scale,scale);} }
  document.getElementById('export').href=off.toDataURL('image/png');
}
syncPalette();
setup(32,false);
</script>
</body>
</html>
